<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Career Service Exam (CSE) Guide for March 2027."/>
  <title>Career Service Exam (CSE) Guide, for March 2027.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="footer/footer.css" />
  <link rel="stylesheet" href="sm/sm.css" />
  <link rel="stylesheet" href="daily-quote/daily-quote.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YOUR_MEASUREMENT_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DN2G4R1KJW');
  </script>

</head>

<body>
  <main>

    <!-- Cover -->
    <section class="cover" aria-label="Career Service Exam guide cover">
      <img src="images/cover.png" alt="Illustrated office scene"/>
    </section>

    <div class="page-icon-wrapper">
      <img
        class="page-icon-cover"
        src="images/icon.png"
        alt=""
        aria-hidden="true"
      />
    </div>

    <div class="page-shell">

      <!-- Page Header -->
      <header class="page-header">
        <h1>Career Service Exam (CSE) Guide, for March 14, 2027.</h1>
      </header>

      <!-- Callout -->
      <div class="callout">
        <img
          class="page-icon"
          src="images/icon.png"
          alt=""
          aria-hidden="true"
        />
        <p>I created this simple guide for all CSE examinees. Hope this helps!</p>
      </div>


      <!-- Database / Gallery -->
      <section class="database" aria-label="CSE guide sections">

        <!-- Cards -->
        <div class="cards-grid">
          <!-- Card 1 -->
          <a href="paano/paano.html" class="card">
            <img
              class="card-cover"
              src="images/paano.png"
              alt="Illustration of an examinee reading at a desk"
            />

            <div class="card-title">
              <img
                class="card-icon"
                src="images/icon.png"
                alt=""
                aria-hidden="true"
              />

              <span>“Paano po mag-take ng CSE? Paano po yung process?”</span>
            </div>
          </a>

          <!-- Card 2 -->
          <a
            class="card"
            href="eserve/eserve.html" 
            aria-label="eServe Step-by-Step Guide"
          >
            <img
              class="card-cover"
              src="images/eserve.jpg"
              alt="Illustration of the eServe appointment system"
            />

            <div class="card-title">
              <img
                class="card-icon"
                src="images/icon.png"
                alt=""
                aria-hidden="true"
              />

              <span>eServe Step-by-Step Guide</span>
            </div>
          </a>

          <!-- Card 3 -->
          <a
            class="card"
            href="requirements/requirements.html"
            aria-label="Requirements"
          >
            <img
              class="card-cover"
              src="images/requirements.png"
              alt="Illustration of CSE requirements and identification documents"
            />

            <div class="card-title">
              <img
                class="card-icon"
                src="images/icon.png"
                alt=""
                aria-hidden="true"
              />

              <span>Requirements</span>
            </div>
          </a>

          <!-- Card 4 -->
          <a
            class="card"
            href="faqs/faqs.html"
            aria-label="FAQs, Tips, Recommendations"
          >
            <img
              class="card-cover"
              src="images/faqs.png"
              alt="Illustration of a person working on a computer"
            />
            <div class="card-title">
              <img
                class="card-icon"
                src="images/icon.png"
                alt=""
                aria-hidden="true"
              />
              <span>FAQs, Tips, Recommendations</span>
            </div>
          </a>

        </div>
      </section>

      <!-- Footer -->
      <div id="footer"></div>

      <!-- Social Media Accounts -->
      <div id="sm"></div>
    
    </div>
  </main>

  <!-- Daily Quote -->
  <div id="daily-quote"></div>

  <script src="script.js"></script>
</body>
</html>
